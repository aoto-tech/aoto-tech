<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230" viewBox="0 0 440 230" role="img" aria-labelledby="title desc">
  <title id="title">Aoto-Tech recent contribution stack</title>
  <desc id="desc">Recent work across Java, Rust, TypeScript, and Python projects.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5B54D6"/>
      <stop offset="0.55" stop-color="#D65FC0"/>
      <stop offset="1" stop-color="#FFB566"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="438" height="228" rx="10" fill="url(#card)" stroke="#E5D9FF" stroke-opacity="0.8"/>

  <g fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="24" y="40" font-size="22" font-weight="700">Recent Contribution Stack</text>
    <text x="24" y="64" font-size="12" opacity="0.82">Languages and representative projects</text>

    <circle cx="30" cy="98" r="5" fill="#F89820"/>
    <text x="46" y="103" font-size="14" font-weight="700">Java</text>
    <text x="128" y="103" font-size="12" opacity="0.88">Spotless · SpotBugs · Checkstyle</text>

    <circle cx="30" cy="133" r="5" fill="#DEA584"/>
    <text x="46" y="138" font-size="14" font-weight="700">Rust</text>
    <text x="128" y="138" font-size="12" opacity="0.88">DataFusion · Oxc</text>

    <circle cx="30" cy="168" r="5" fill="#66D9EF"/>
    <text x="46" y="173" font-size="14" font-weight="700">TypeScript</text>
    <text x="128" y="173" font-size="12" opacity="0.88">CellFence · Medusa</text>

    <circle cx="30" cy="203" r="5" fill="#FFD43B"/>
    <text x="46" y="208" font-size="14" font-weight="700">Python</text>
    <text x="128" y="208" font-size="12" opacity="0.88">dbt-plan · RFC_HTTP</text>
  </g>
</svg>
